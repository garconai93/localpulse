name: Daily Event Scraper

# Rulează zilnic la 06:00 UTC (08:00 RO), și poate fi declanșat manual din Actions tab
on:
  schedule:
    # Cron: minute hour day month weekday (UTC)
    # 06:00 UTC = 08:00 RO (vara) sau 07:00 RO (iarna)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Câte zile în viitor să scrape-uiesc (iabilet)'
        required: false
        default: '30'
        type: string
      days_sds:
        description: 'Câte zile în viitor să scrape-uiesc (stiudelasorina)'
        required: false
        default: '90'
        type: string
      days_zsn:
        description: 'Câte zile în viitor să scrape-uiesc (zilesinopti)'
        required: false
        default: '180'
        type: string

permissions:
  contents: write

jobs:
  scrape-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Fetch new events (iabilet)
        id: fetch-iabilet
        continue-on-error: true
        run: |
          cd scripts
          DAYS="${{ github.event.inputs.days || '30' }}"
          python fetch_events.py --days "$DAYS" > new_events_iabilet.json
          IABILET_COUNT=$(python -c "import json; d=json.load(open('new_events_iabilet.json')); print(sum(len(c['events']) for c in d))")
          echo "iabilet_count=$IABILET_COUNT" >> $GITHUB_OUTPUT
          echo "✓ Fetched $IABILET_COUNT new events from iabilet" >&2

      - name: Fetch new events (stiudelasorina)
        id: fetch-sds
        run: |
          cd scripts
          DAYS_SDS="${{ github.event.inputs.days_sds || '90' }}"
          python fetch_stiudelasorina.py --days "$DAYS_SDS" > new_events_sds.json
          SDS_COUNT=$(python -c "import json; d=json.load(open('new_events_sds.json')); print(sum(len(c['events']) for c in d))")
          echo "sds_count=$SDS_COUNT" >> $GITHUB_OUTPUT
          echo "✓ Fetched $SDS_COUNT events from stiudelasorina" >&2

      - name: Fetch new events (zilesinopti)
        id: fetch-zsn
        run: |
          cd scripts
          DAYS_ZSN="${{ github.event.inputs.days_zsn || '180' }}"
          python fetch_zilesinopti.py --days "$DAYS_ZSN" > new_events_zsn.json
          ZSN_COUNT=$(python -c "import json; d=json.load(open('new_events_zsn.json')); print(sum(len(c['events']) for c in d))")
          echo "zsn_count=$ZSN_COUNT" >> $GITHUB_OUTPUT
          echo "✓ Fetched $ZSN_COUNT events from zilesinopti" >&2

      - name: Merge iabilet into events.json
        run: |
          cd scripts
          python merge_events.py new_events_iabilet.json

      - name: Merge stiudelasorina into events.json
        run: |
          cd scripts
          python merge_events.py new_events_sds.json

      - name: Merge zilesinopti into events.json
        run: |
          cd scripts
          python merge_events.py new_events_zsn.json

      - name: Get totals
        id: totals
        run: |
          cd scripts
          TOTAL=$(python -c "import json; d=json.load(open('../events.json')); print(sum(len(c['events']) for c in d.get('cities',[])))")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

      - name: Geocode venues (Nominatim)
        id: geocode
        run: |
          cd scripts
          python geocode_venues.py
          GEOCODED=$(python -c "import json; d=json.load(open('../events.json')); print(d.get('last_geocoded','never'))")
          echo "last_geocoded=$GEOCODED" >> $GITHUB_OUTPUT

      - name: Check if events.json changed
        id: diff
        run: |
          if git diff --quiet events.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes to events.json" >&2
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✓ events.json has new data" >&2
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "Garcon Bot"
          git config user.email "garcon@garconai.dev"
          git add events.json
          # geocode_cache.json e opțional (poate fi regenerat din script)
          git add geocode_cache.json 2>/dev/null || true
          TODAY=$(date -u +'%Y-%m-%d')
          TOTAL=${{ steps.totals.outputs.total }}
          git commit -m "🤖 Daily scrape: $TOTAL total events ($TODAY)"
          git push origin main

      - name: Summary
        if: always()
        run: |
          echo "### Daily scrape summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- iabilet events fetched: ${{ steps.fetch-iabilet.outputs.iabilet_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- stiudelasorina events fetched: ${{ steps.fetch-sds.outputs.sds_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- zilesinopti events fetched: ${{ steps.fetch-zsn.outputs.zsn_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- Total events in DB: ${{ steps.totals.outputs.total }}" >> $GITHUB_STEP_SUMMARY
          echo "- Last geocoded: ${{ steps.geocode.outputs.last_geocoded }}" >> $GITHUB_STEP_SUMMARY
          echo "- Events.json changed: ${{ steps.diff.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run date: $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
